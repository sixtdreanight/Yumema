name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20", "22"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install dependencies
        # npm install (not npm ci) until package-lock.json is regenerated with vitest; run `npm install` locally and commit the lockfile to restore `npm ci`
        run: npm install
      - name: Type check
        run: npx tsc --noEmit
      - name: Build check (main + preload + renderer)
        run: npx electron-vite build
      - name: Run tests
        run: npx vitest run
